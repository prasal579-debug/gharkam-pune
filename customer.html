<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - Gharkam.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col justify-between" onload="checkOrderState()">

    <!-- Header -->
    <header class="bg-blue-600 text-white py-4 px-6 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🏠</span>
            <h1 class="text-xl font-bold">GHARKAM<span class="text-yellow-400">.com</span> (Customer)</h1>
        </div>
        <a href="index.html" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg transition text-white font-semibold">Logout</a>
    </header>

    <!-- Main Content (Your Original Form) -->
    <main class="flex-grow max-w-lg w-full mx-auto p-6 my-6">
        <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Book a Home Service 🛠️</h2>
            
            <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
                
                <!-- Service Type -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Select Service:</label>
                    <select id="serviceType" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white">
                        <option value="">-- Service Nivada --</option>
                        <option value="Cleaning">Cleaning</option>
                        <option value="Electrician">Electrician (Bijali repair)</option>
                        <option value="Plumbing">Plumber (Nal/Pipe repair)</option>
                        <option value="Painting">Painting</option>
                    </select>
                </div>

                <!-- Area -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Select Area In Pune:</label>
                    <select id="area" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white">
                        <option value="">-- Area Nivada --</option>
                        <option value="Swargate">Swargate</option>
                        <option value="Katraj">Katraj</option>
                        <option value="Shivajinagar">Shivajinagar</option>
                        <option value="Kothrud">Kothrud</option>
                        <option value="Hadapsar">Hadapsar</option>
                    </select>
                </div>

                <!-- Photo Upload -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Upload Photo of Work (Kamacha Photo):</label>
                    <input type="file" id="workPhoto" class="w-full p-2 border rounded-xl text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>

                <!-- Budget -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Your Budget / Payment Offer (₹):</label>
                    <input type="number" id="budget" placeholder="E.g., 300" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>

                <!-- Date & Time -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Date:</label>
                        <input type="date" id="orderDate" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Time:</label>
                        <input type="time" id="orderTime" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    </div>
                </div>

                <!-- Address -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Exact Location / Address In Pune:</label>
                    <textarea id="address" placeholder="E.g., Flat No 4, Near Bus Stand" rows="2" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-300">
                    Book Appointment
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-gray-500 text-xs bg-white border-t">
        &copy; 2026 Gharkam.com | Customer Portal
    </footer>

    <!-- Logic Script -->
    <script>
        function checkOrderState() {
            let activeOrder = localStorage.getItem('gharkamActiveOrder');
            let submitBtn = document.getElementById('submitBtn');

            if (activeOrder) {
                // Jar magchi order pending asel tar button disable karun status dakva
                submitBtn.innerText = "Book Appointment (Request Pending)";
                submitBtn.disabled = true;
                submitBtn.className = "w-full bg-gray-400 text-white font-bold py-3.5 rounded-xl shadow-inner cursor-not-allowed";
            } else {
                // Order nasel tar button normal rahil
                submitBtn.innerText = "Book Appointment";
                submitBtn.disabled = false;
                submitBtn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-300";
            }
        }

        function submitOrder(event) {
            event.preventDefault();
            
            let orderData = {
                service: document.getElementById('serviceType').value,
                area: document.getElementById('area').value,
                budget: document.getElementById('budget').value,
                date: document.getElementById('orderDate').value,
                time: document.getElementById('orderTime').value,
                address: document.getElementById('address').value
            };

            // Save active order to localStorage
            localStorage.setItem('gharkamActiveOrder', JSON.stringify(orderData));
            
            alert("Order Successfully Book Zali!");
            location.reload();
        }
    </script>
</body>
</html>
